<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <canvas id="c1" width="600" height="400">
        Canvas not supported.
        当前浏览器不支持canvas，请下载最新的浏览器
        <a href="https://www.microsoft.com/en-us/edge/download">立即下载</a>
    </canvas>
    <script>
        var c1 = document.getElementById("c1");
        // 判断是否有绘图上下文对象
        if (!c1.getContext) {
            window.alert("当前浏览器不支持canvas，请下载最新的浏览器");
        }
        // 获取绘图上下文对象
        var ctx = c1.getContext("2d");
        // 绘制矩形
        ctx.fillStyle = "red"; // 设置填充颜色
        ctx.fillRect(0, 0, 50, 50); // x,y,w,h
        ctx.save(); // 将状态保存到栈中，保存绘图上下文状态

        ctx.fillStyle = "blue"; // 设置填充颜色
        ctx.fillRect(50, 50, 50, 50); // x,y,w,h
        ctx.save(); // 将状态保存到栈中，保存绘图上下文状态

        ctx.fillStyle = "green"; // 设置填充颜色
        ctx.fillRect(100, 100, 50, 50); // x,y,w,h
        ctx.save(); // 将状态保存到栈中，保存绘图上下文状态

        ctx.restore(); // 从栈顶恢复绘图上下文状态
        ctx.fillRect(150, 150, 50, 50);
        ctx.restore();
        ctx.fillRect(200, 200, 50, 50);
        ctx.restore(); 
        ctx.fillRect(250, 250, 50, 50);
    </script>
</body>
</html>
