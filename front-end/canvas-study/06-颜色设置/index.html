<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>

<body>
    <canvas id="c1" width="600" height="400"></canvas>
    <script>
        var c1 = document.getElementById("c1");
        // 获取绘图上下文对象
        var ctx = c1.getContext("2d");
        // 从封装的路径对象中获取绘制图形api
        var hearPath = new Path2D();
        console.log('-----Path2D------', hearPath);

        // 设置全局透明度
        ctx.globalAlpha = 0.5;
        
        // 绘制三次贝塞尔曲线，三个控制点
        hearPath.moveTo(300, 200); // 起始点
        hearPath.bezierCurveTo(350, 150, 400, 200, 300, 250);
        hearPath.bezierCurveTo(200, 200, 250, 150, 300, 200);

        ctx.strokeStyle = "red"; // 设置描边颜色，支持rgb,rgba,hsl,hsla,hex,named color等格式
        ctx.stroke(hearPath);

        var hearPath2 = new Path2D();
        hearPath2.moveTo(200, 300);
        hearPath2.quadraticCurveTo(150, 300, 150, 200); // 控制点(150,300) 终点(150,200)
        hearPath2.quadraticCurveTo(150, 100, 300, 100);
        hearPath2.quadraticCurveTo(450, 100, 450, 200);
        hearPath2.quadraticCurveTo(450, 300, 250, 300);
        hearPath2.quadraticCurveTo(250, 350, 150, 350);
        hearPath2.quadraticCurveTo(200, 350, 200, 300);
        ctx.strokeStyle = "#ff00ff";
        ctx.stroke(hearPath2);
        ctx.fillStyle = "rgba(255,200,200,0.3)";
        ctx.fill(hearPath);

        var polyline = new Path2D("M10 10 h 80 v 80 h -80 z"); // 绘制一个矩形路径svg路径语法
        ctx.strokeStyle = "rgba(0,0,0,255)";
        ctx.stroke(polyline);

        ctx.fillStyle = "rgba(0,255,0,0.5)";
        ctx.fillRect(280,180,40,40);
    </script>
</body>

</html>
