<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>

<body>
    <canvas id="c1" width="600" height="400"></canvas>
    <video preload="auto" crossorigin="anonymous" hidden
        src="https://mdn.github.io/dom-examples/canvas/chroma-keying/media/video.mp4" controls></video>
    <button id="play-button">播放/暂停</button>
    <script>
        var c1 = document.getElementById("c1");
        // 获取绘图上下文对象
        var ctx = c1.getContext("2d");
        // 绘制视屏
        // var video = document.createElement("video");
        // video.src = "https://mdn.github.io/dom-examples/canvas/chroma-keying/media/video.mp4";
        var video = document.querySelector("video");

        var playButton = document.getElementById("play-button");
        playButton.onclick = function () {
            if (video.paused) {
                video.play();
                draw(); // 循环绘制视频帧到canvas上
            } else {
                video.pause();
            }
        }

        // 绘制logo图片到视频上
        var logo = new Image();
        logo.src = "./1.png";

        function draw() {
            ctx.drawImage(video, 0, 0, 600, 400);
            ctx.drawImage(logo, 500, 0,100,50);
            requestAnimationFrame(draw);
        }
    </script>
</body>

</html>
