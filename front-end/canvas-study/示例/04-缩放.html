<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #canvas {
            border: 1px solid gray;
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const circles = []; // 存储圆
        const statusConfig = { // 状态配置
            idle: 0,
            drag_start: 1,
            dragging: 2
        }
        const canvasInfo = {
            status: statusConfig.idle,
            dragTarget: null,
            lastPosition: { // 鼠标最后一次位置
                x: null,
                y: null
            },
            offsetPosition: { // 图形偏移位置
                x: null,
                y: null
            },
            offset: { // 控制画布偏移量
                x: 0,
                y: 0
            },
            scale: 1, // 缩放比例
            scaleStep: 0.1, // 缩放步长
            minScale: 0.1, // 最小缩放比例
            maxScale: 2, // 最大缩放比例
        }


        // 绘制圆
        const drawCircle = (ctx, cx, cy, r) => {
            ctx.save()
            ctx.beginPath();
            ctx.strokeStyle = 'blue';
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.closePath();
            ctx.restore()
        }

        drawCircle(ctx, 100, 100, 50);
        circles.push({ x: 100, y: 100, r: 50 });

        // 获取画布上的点位置
        const getCanvasPosition = (e, offset = { x: 0, y: 0 }, scale = 1) => {
            return {
                // x: e.offsetX,
                // y: e.offsetY,
                // 偏移、缩放计算真实位置
                x: (e.offsetX - offset.x) / scale,
                y: (e.offsetY - offset.y) / scale
            }
        }

        // 获取两点之间的距离
        const getDistance = (p1, p2) => {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2))
        }

        // 判断该点是否在圆内
        const ifInCircle = (pos) => {
            for (let i = 0; i < circles.length; i++) {
                return getDistance(circles[i], pos) < circles[i].r && circles[i];
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const canvasPosition = getCanvasPosition(e, canvasInfo.offset, canvasInfo.scale);
            const circle = ifInCircle(canvasPosition);
            if (circle) {
                canvasInfo.dragTarget = circle;
                canvasInfo.status = statusConfig.drag_start;
                canvasInfo.lastPosition = canvasPosition;
                canvasInfo.offsetPosition = canvasPosition;
            }
        })

        canvas.addEventListener('mousemove', (e) => {
            const canvasPosition = getCanvasPosition(e, canvasInfo.offset, canvasInfo.scale);
            // 偏移后重机计算鼠标在画布上的真实位置
            // const realCanvasPosition = {
            //     x: (canvasPosition.x - canvasInfo.offset.x) / canvasInfo.scale,
            //     y: (canvasPosition.y - canvasInfo.offset.y) / canvasInfo.scale
            // }

            // 拖拽时鼠标样式
            if (ifInCircle(canvasPosition)) {
                // if (ifInCircle(realCanvasPosition)) {
                canvas.style.cursor = 'grab' //'all-scroll';
            } else {
                canvas.style.cursor = 'default'
            }
            if (canvasInfo.status === statusConfig.drag_start && getDistance(canvasPosition, canvasInfo.lastPosition) > 5) {
                // 拖拽开始
                canvasInfo.status = statusConfig.dragging;
                canvasInfo.offsetPosition = canvasPosition;

            } else if (canvasInfo.status === statusConfig.dragging) {
                const { dragTarget } = canvasInfo;
                dragTarget.x += canvasPosition.x - canvasInfo.offsetPosition.x;
                dragTarget.y += canvasPosition.y - canvasInfo.offsetPosition.y;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                circles.forEach(c => drawCircle(ctx, c.x, c.y, c.r));
                canvasInfo.offsetPosition = canvasPosition;
            }
        })

        canvas.addEventListener('mouseup', (e) => {
            if (canvasInfo.status === statusConfig.dragging) {
                canvasInfo.status = statusConfig.idle;
            }

        })

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const canvasPosition = getCanvasPosition(e, canvasInfo.offset, canvasInfo.scale);
            // 偏移后计算鼠标真实在画布上的位置 ctx.translate(100,0) 右偏100px
            // const realCanvasPosition = {
            //     x: canvasPosition.x - canvasInfo.offset.x,
            //     y: canvasPosition.y - canvasInfo.offset.y
            // }
            // 缩放中心点
            const { scaleStep, minScale, maxScale } = canvasInfo
            // const deltaX = realCanvasPosition.x / canvasInfo.scale * scaleStep;
            // const deltaY = realCanvasPosition.y / canvasInfo.scale * scaleStep;
            const deltaX = canvasPosition.x / canvasInfo.scale * scaleStep;
            const deltaY = canvasPosition.y / canvasInfo.scale * scaleStep;

            // 缩放
            if (e.wheelDelta > 0 && canvasInfo.scale < maxScale) {
                // 放大操作
                canvasInfo.offset.x -= deltaX;
                canvasInfo.offset.y -= deltaY;
                canvasInfo.scale += scaleStep;
            } else if (e.wheelDelta < 0 && canvasInfo.scale > minScale) {
                // 缩小操作
                canvasInfo.offset.x += deltaX;
                canvasInfo.offset.y += deltaY;
                canvasInfo.scale -= scaleStep;
            }
            ctx.setTransform(canvasInfo.scale, 0, 0, canvasInfo.scale, canvasInfo.offset.x, canvasInfo.offset.y);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            circles.forEach(c => drawCircle(ctx, c.x, c.y, c.r));
        })

    </script>
</body>

</html>
