<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>

<body>
    <canvas id="c1" width="600" height="400"></canvas>
    <script>
        var c1 = document.getElementById("c1");
        // 获取绘图上下文对象
        var ctx = c1.getContext("2d");
        // 圆锥渐变
        let coneGradient = ctx.createConicGradient(Math.PI/4, 300,200); // (angle,x,y)
        coneGradient.addColorStop(0, "red");
        coneGradient.addColorStop(0.5, "yellow");
        coneGradient.addColorStop(1, "blue");
        ctx.fillStyle = coneGradient;
        ctx.fillRect(0, 0, c1.width, c1.height);
    </script>
</body>

</html>
