<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>

<body>
    <canvas id="c1" width="600" height="400" style="border: 1px solid #ccc;"></canvas>
    <script>
        var c1 = document.getElementById("c1");
        // 获取绘图上下文对象
        var ctx = c1.getContext("2d");
        ctx.beginPath();
        // transform集位移、旋转、缩放和倾斜变换的组合
        ctx.transform(1, 0, 0, 1, 100, 100); // a,b,c,d,e,f 参数分别是变换矩阵的元素3*3
        // 绘制矩形
        ctx.fillRect(0, 0, 500, 50);
        ctx.closePath()

        ctx.beginPath();
        // 旋转45度，会改变坐标轴的方向，还缩放长度根号2倍
        ctx.transform(1, 1, 1, -1, -100, -100);
        // 绘制矩形
        ctx.fillRect(0, 0, 500, 50);
        ctx.closePath()
    </script>
</body>

</html>
