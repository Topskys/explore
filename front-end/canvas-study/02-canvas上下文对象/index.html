<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <canvas id="c1" width="600" height="400">
        Canvas not supported.
        当前浏览器不支持canvas，请下载最新的浏览器
        <a href="https://www.microsoft.com/en-us/edge/download">立即下载</a>
    </canvas>
    <script>
        var c1 = document.getElementById("c1");
        // 判断是否有绘图上下文对象
        if (!c1.getContext) {
            window.alert("当前浏览器不支持canvas，请下载最新的浏览器");
        }
        // 测试兼容性
        console.log('c1\n',c1.getContext,c1.getContext('2d'));
        console.log('body\n',document.body.getContext)


        // 获取绘图上下文对象
        var ctx = c1.getContext("2d");
        // 绘制矩形
        ctx.fillRect(0, 0, 50, 50); // x,y,w,h

    </script>
</body>
</html>
