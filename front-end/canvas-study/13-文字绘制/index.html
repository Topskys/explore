<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <canvas id="c1" width="600" height="400"></canvas>
    <script>
        var c1 = document.getElementById("c1");
        // 获取绘图上下文对象
        var ctx = c1.getContext("2d");
        // 绘制文字，设置字体样式
        ctx.font = "100px Arial"; // 字体大小，字体名称
        // ctx.fillText("Hello Canvas", 10, 50,100); // text，x，y，maxTextWidth

        // 设置文本对齐方式
        ctx.textAlign = "center"; // start, end, left, right, center, justify
        ctx.textBaseline = "middle"; // top, hanging, middle, alphabetic, ideographic, bottom
        ctx.direction = "rtl"; // ltr, rtl, inherit

        // 预测量文本宽度
        console.log(ctx.measureText("Hello Canvas!")); // 返回文本宽度，单位是像素

        ctx.strokeStyle='red'
        ctx.strokeText("Hello Canvas!", 300, 200); 

        ctx.arc(300,200,5,0,Math.PI*2);
        ctx.fill();

    </script>
</body>
</html>
