<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <canvas id="c1" width="600" height="400" style="width: 800px;height: 600px;">
        Canvas not supported.
        当前浏览器不支持canvas，请下载最新的浏览器
        <a href="https://www.microsoft.com/en-us/edge/download">立即下载</a>
    </canvas>
    <script>
        var c1 = document.getElementById("c1");
        const ctx = c1.getContext("2d");
        ctx.ellipse(100, 100, 50, 20, Math.PI / 6, 0, 2 * Math.PI);
        ctx.stroke();
    </script>
</body>

</html>
